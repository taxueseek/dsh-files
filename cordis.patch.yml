# dsh-files bundle patch: one insert registering the read_document tool plugin.
# The row id must match the node half's exported cordis `name`.
- insert:
    - id: files-toolkit
      name: 'dsh-files'
      config:
        maxFileBytes: 25165824
        readLimit: 2000
        sheetRowLimit: 200
        maxSheets: 5
        maxOutputChars: 24000
        readTimeoutMs: 120000
